name: CI

on:
  push:
    branches:
      - main
  pull_request:

# Cancel redundant runs on the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

permissions:
  contents: read

jobs:
  jetls:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.12"
      - uses: julia-actions/cache@v3
      - name: Install jetls
        run: |
          julia --startup-file=no -e '
            using Pkg
            Pkg.Registry.add("General")
            Pkg.Apps.add(url="https://github.com/aviatesk/JETLS.jl", rev="release")'
          echo "$HOME/.julia/bin" >> "$GITHUB_PATH"
      - name: jetls check
        run: |
          shopt -s nullglob
          jetls check --exit-severity=error --progress=none *.jl src/*.jl test/*.jl test/fixtures/*.jl

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        version:
          - "1.12"
          # 1.13 is still a prerelease channel; ~1.13.0-0 picks the latest 1.13.x (including RCs).
          - "~1.13.0-0"
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          coverage: ${{ matrix.version == '1.12' }}
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.version == '1.12'
      - name: Coverage summary
        if: matrix.version == '1.12'
        run: |
          julia --color=no -e '
          using Pkg
          Pkg.add("Coverage")
          using Coverage, Printf
          files = process_folder("src")
          for fc in files
              c, t = get_summary(fc)
              t == 0 && continue
              @printf("%-32s %5.1f%%\n", basename(fc.filename), 100 * c / t)
          end
          c, t = get_summary(files)
          @printf("%-32s %5.1f%%  (%d/%d lines)\n", "TOTAL", 100 * c / t, c, t)
          '
