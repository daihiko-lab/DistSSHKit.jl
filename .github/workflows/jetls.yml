name: JETLS

on:
  pull_request:
    paths:
      - "**/*.jl"
      - ".github/workflows/jetls.yml"
  push:
    branches:
      - main
    paths:
      - "**/*.jl"
      - ".github/workflows/jetls.yml"

concurrency:
  group: jetls-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

permissions:
  contents: read

jobs:
  jetls:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.12"
      - uses: julia-actions/cache@v3
      - name: Install jetls
        run: |
          if [ -x "$HOME/.julia/bin/jetls" ]; then
            echo "jetls already installed (Julia cache hit)"
          else
            julia --startup-file=no -e '
              using Pkg
              Pkg.Registry.add("General")
              Pkg.Apps.add(url="https://github.com/aviatesk/JETLS.jl", rev="release")'
          fi
          echo "$HOME/.julia/bin" >> "$GITHUB_PATH"
      - name: jetls check
        run: |
          shopt -s nullglob
          jetls --threads=auto -- check --exit-severity=error --progress=none \
            *.jl src/*.jl src/SSHRunner/*.jl src/runner/*.jl test/*.jl test/fixtures/*.jl
